services:
  meshsense:
    image: ghcr.io/roperscrossroads/meshsense-docker-arm64:main
    container_name: meshsense
    restart: unless-stopped
    ports:
      - "5920:5920"
    environment:
      TZ: Europe/Berlin
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-5920}"
      ACCESS_KEY: "${ACCESS_KEY:-changeme}"
      DISPLAY: ":99"
      ADDRESS: "${ADDRESS:-0.0.0.0}"
    volumes:
      - ./data:/home/mesh/.meshsense
      - /run/dbus:/run/dbus:ro
    cap_add:
      - NET_ADMIN
    user: "1000:1000"
